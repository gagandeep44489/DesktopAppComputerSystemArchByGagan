{% extends 'base.html' %}
{% block content %}
<h2>All Users</h2>
<table class="table table-striped"><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>
{% for u in users %}<tr><td>{{ u.full_name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td></tr>{% endfor %}
</tbody></table>
{% endblock %}
