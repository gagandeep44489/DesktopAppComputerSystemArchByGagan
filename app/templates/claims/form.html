{% extends 'base.html' %}
{% block title %}Submit Claim{% endblock %}
{% block content %}
<h2>Submit Claim</h2>
<form method="post" enctype="multipart/form-data" class="row g-3">
  <div class="col-md-6">
    <label>Policy</label>
    <select class="form-select" name="policy_id" required>
      <option value="">Select a policy</option>
      {% for p in policies %}<option value="{{ p.id }}">{{ p.policy_number }} - {{ p.policy_type }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-md-6"><label>Claim Amount</label><input type="number" step="0.01" min="0" name="claim_amount" class="form-control" required></div>
  <div class="col-md-6"><label>Incident Date</label><input type="date" name="incident_date" class="form-control" required></div>
  <div class="col-md-6"><label>Document (PNG/JPG/PDF)</label><input type="file" name="document" class="form-control"></div>
  <div class="col-12"><label>Description</label><textarea name="description" class="form-control" rows="4" required></textarea></div>
  <div><button class="btn btn-primary">Submit Claim</button></div>
</form>
{% endblock %}
